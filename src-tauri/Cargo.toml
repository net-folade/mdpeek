[package]
name = "mdpeek"
version = "1.1.0"
description = "A lightweight Markdown reader and editor"
authors = ["Folade"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves local images to the webview. It must be listed here and
# enabled in tauri.conf.json — tauri-build checks the two agree.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tempfile = "3"

[profile.release]
# Size is the point of this project, so trade compile time for a smaller binary.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
