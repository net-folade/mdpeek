[package]
name = "mdpeek"
version = "0.1.0"
description = "A lightweight Markdown reader"
authors = ["Folade"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[profile.release]
# Size is the point of this project, so trade compile time for a smaller binary.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
